name: test

on: [push, pull_request]
jobs:
  test:
    name: (${{ matrix.os }} / Go ${{ matrix.go-version }})
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        go-version: ['1.26', '1.27' ]
      fail-fast: false
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Run tests without coverage (Windows, go 1.26+)
        if: runner.os == 'Windows'
        run: go test -v -race ./...

      - name: Run tests with coverage (Linux/macOS, go 1.26+)
        if: runner.os != 'Windows'
        run: |
          go test -v -race -cover -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

      - name: Check go mod tidy
        if: runner.os != 'Windows'
        shell: bash
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain)" ]; then
          git status --porcelain
          exit 1
          fi

      - name: Check go mod verify
        if: runner.os != 'Windows'
        run: go mod verify

      - name: Test CLI
        if: runner.os != 'Windows'
        run: |
          cd cli
          go mod tidy
          go test -v -race ./...
